<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Despensa MVP 0.3</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  max-width:720px;
  margin:auto;
  padding:20px;
  background:#f5f5f7;
  color:#1d1d1f
}

.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin:12px 0
}

.item{
  padding:12px 0;
  border-bottom:1px solid #eee
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px
}

button{
  font-size:17px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#111;
  color:white;
  width:100%;
  margin-top:12px
}

.muted{
  color:#666;
  font-size:14px
}

.ok{
  color:#137333
}

.hidden{
  display:none
}

.price{
  font-weight:700
}
</style>
</head>

<body>

<h1>Despensa</h1>
<p>Protótipo 0.3 — NFC-e → compra → despensa.</p>

<div id="compra" class="card hidden">

  <div class="ok">
    <b>Compra importada ✓</b>
  </div>

  <h2 id="mercado"></h2>

  <div id="cnpj" class="muted"></div>

  <div id="itens"></div>

  <div class="row" style="margin-top:16px">
    <b>Total dos itens</b>
    <b id="total"></b>
  </div>

  <button id="add">
    Adicionar à minha despensa
  </button>

</div>

<div id="inicio" class="card">

  <b>Minha despensa</b>

  <p class="muted">
    Abra a NFC-e no Safari e use o atalho de compartilhamento para enviar a compra.
  </p>

  <div id="estoque"></div>

</div>

<script>

const esc = s =>
  String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

const numero = v =>
  Number(
    String(v ?? 0)
      .replace(/\./g,"")
      .replace(",",".")
  ) || 0;

const brl = v =>
  numero(v).toLocaleString(
    "pt-BR",
    {
      style:"currency",
      currency:"BRL"
    }
  );


function lerCompra(){

  const parametros =
    new URLSearchParams(location.search);

  const dados =
    parametros.get("dados") ||
    parametros.get("compra");

  if(!dados)
    return null;

  try{
    return JSON.parse(dados);
  }
  catch(e){}

  try{
    return JSON.parse(
      decodeURIComponent(dados)
    );
  }
  catch(e){}

  return null;
}


function mostrarEstoque(){

  const produtos =
    JSON.parse(
      localStorage.getItem("despensa_itens")
      || "[]"
    );

  const area =
    document.getElementById("estoque");

  if(!produtos.length){

    area.innerHTML =
      '<p class="muted">Nenhum produto adicionado ainda.</p>';

    return;
  }

  area.innerHTML =
    produtos
    .slice()
    .reverse()
    .map(item => `

      <div class="item">

        <b>
          ${esc(item.produto)}
        </b>

        <div class="muted">
          ${esc(item.quantidade)}
          ${esc(item.unidade)}
          ·
          ${esc(item.mercado)}
        </div>

      </div>

    `)
    .join("");
}


function mostrarCompra(compra){

  document
    .getElementById("inicio")
    .classList
    .add("hidden");

  document
    .getElementById("compra")
    .classList
    .remove("hidden");


  document.getElementById("mercado")
    .textContent =
      compra.mercado ||
      "Estabelecimento";


  document.getElementById("cnpj")
    .textContent =
      compra.cnpj
      ? "CNPJ " + compra.cnpj
      : "";


  const produtos =
    Array.isArray(compra.produtos)
    ? compra.produtos
    : [];


  document.getElementById("itens")
    .innerHTML =

    produtos.map(item => `

      <div class="item">

        <div class="row">

          <b>
            ${esc(item.produto)}
          </b>

          <span class="price">
            ${brl(item.valorTotal)}
          </span>

        </div>

        <div class="muted">

          ${esc(item.quantidade)}
          ${esc(item.unidade)}

          · unit.

          ${brl(item.valorUnitario)}

        </div>

      </div>

    `).join("");


  const total =
    produtos.reduce(
      (soma,item) =>
        soma + numero(item.valorTotal),
      0
    );


  document.getElementById("total")
    .textContent =
      brl(total);


  document.getElementById("add")
    .onclick = () => {

      const estoque =
        JSON.parse(
          localStorage.getItem(
            "despensa_itens"
          ) || "[]"
        );


      produtos.forEach(item => {

        estoque.push({

          ...item,

          mercado:
            compra.mercado || "",

          cnpj:
            compra.cnpj || ""

        });

      });


      localStorage.setItem(
        "despensa_itens",
        JSON.stringify(estoque)
      );


      history.replaceState(
        {},
        "",
        location.pathname
      );


      document
        .getElementById("compra")
        .classList
        .add("hidden");


      document
        .getElementById("inicio")
        .classList
        .remove("hidden");


      mostrarEstoque();


      alert(
        produtos.length +
        " produto(s) adicionados à despensa."
      );

    };

}


const compra =
  lerCompra();


if(compra){

  mostrarCompra(compra);

}
else{

  mostrarEstoque();

}

</script>

</body>
</html>
