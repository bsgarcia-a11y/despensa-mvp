<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Despensa MVP</title><script src='https://unpkg.com/html5-qrcode'></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:720px;margin:auto;padding:20px;background:#f5f5f7;color:#1d1d1f}button{font-size:18px;padding:14px 18px;border:0;border-radius:12px;background:#111;color:white;width:100%;margin:8px 0}.card{background:white;border-radius:16px;padding:16px;margin:12px 0}input,textarea{box-sizing:border-box;width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:10px}#reader{background:white;border-radius:16px;overflow:hidden}.muted{color:#666;font-size:14px}</style></head><body><h1>Despensa</h1><p>Protótipo 0.1 — leitura de QR Code NFC-e RJ.</p><div class='card'><button id='scan'>Escanear nota</button><div id='reader'></div></div><div class='card'><b>QR lido</b><textarea id='qr' rows='5' placeholder='O conteúdo do QR aparecerá aqui'></textarea><button id='parse'>Validar NFC-e</button><div id='out' class='muted'></div></div><script>
let scanner;
function parseNfce(url){try{const u=new URL(url);const p=u.searchParams.get('p');if(!p) throw Error('Parâmetro p não encontrado');const parts=decodeURIComponent(p).split('|');if(parts.length<5) throw Error('Formato inesperado');return {url, chave:parts[0],versao:parts[1],ambiente:parts[2],csc:parts[3],hash:parts[4]};}catch(e){return {erro:e.message}}}
document.getElementById('scan').onclick=async()=>{document.getElementById('reader').innerHTML='';scanner=new Html5Qrcode('reader');const cams=await Html5Qrcode.getCameras();const cam=cams.find(c=>/back|traseira|environment/i.test(c.label))||cams[0];await scanner.start(cam.id,{fps:10,qrbox:{width:250,height:250}},async text=>{document.getElementById('qr').value=text;await scanner.stop();document.getElementById('reader').innerHTML='<p style="padding:12px">QR Code lido ✓</p>';document.getElementById('parse').click();});};
document.getElementById('parse').onclick=()=>{const r=parseNfce(document.getElementById('qr').value.trim());const out=document.getElementById('out');if(r.erro){out.textContent='Erro: '+r.erro;return;}const isRJ=r.chave.startsWith('33');out.innerHTML=`<p><b>NFC-e reconhecida ${isRJ?'do RJ ✓':'(UF diferente do RJ)'}</b></p><p>Chave: ${r.chave}</p><p>Versão QR: ${r.versao} · Ambiente: ${r.ambiente}</p><button id="open">Consultar na SEFAZ-RJ</button>`;document.getElementById('open').onclick=()=>location.href=r.url;};
</script></body></html>
